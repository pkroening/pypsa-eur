# See https://snakemake.readthedocs.io/en/stable/executing/cli.html#profiles

logger: pypsa

# ---------------------------------------------------------------------------
# Executor
# ---------------------------------------------------------------------------
# https://snakemake.github.io/snakemake-plugin-catalog/plugins/executor/slurm.html
executor: slurm

# ---------------------------------------------------------------------------
# Job control
# ---------------------------------------------------------------------------
slurm-jobname-prefix: pypsa-eur

# Maximum number of simultaneously running jobs.
# https://help.itc.rwth-aachen.de/service/rhr4fjjutttf/article/d99e9f242bdb48eaa1c63c45e84fc32f/
# jobs: 80  # default
jobs: 800 # quoted project


# Maximum number of jobs to submit at once (Slurm queues them, but submitting
# thousands at once is wasteful and slows down the scheduler).
max-jobs-per-second: 5
max-status-checks-per-second: 0.5

# ---------------------------------------------------------------------------
# Fault tolerance
# ---------------------------------------------------------------------------
# Retry each failed job.
retries: 2

# Wait up to 5 s for output files to appear on the shared file system after
# a job finishes (takes possible metadata latency into account).
latency-wait: 5

# Keep going with independent jobs even if some jobs fail.
keep-going: True

default-resources:
  slurm_account: thes2299
  runtime: 15min
  threads: 1
  mem_mb: 2540

# Partitions of claix
slurm-partition-config: partitions.yaml

# ---------------------------------------------------------------------------
# Storage related settings
# These may be overwritten with specific file access patterns.
# ---------------------------------------------------------------------------
# default-storage-provider: fs # this requires the snakemake-storage-plugin-fs to be installed
# local-storage-prefix: /dev/shm/$USER
# remote-job-local-storage-prefix: /localscratch/$SLURM_JOB_ID 

# ---------------------------------------------------------------------------
# Slurm-specific submission options (passed via --slurm-* flags or embedded
# in the job script).
# ---------------------------------------------------------------------------
slurm-logdir: "/home/$USER/.snakemake/slurm_logs"
slurm-keep-successful-logs: True
slurm-efficiency-report: True
slurm-efficiency-report-path: "/home/$USER/.snakemake/slurm_eff_reports"

# ---------------------------------------------------------------------------
# Rerun behaviour
# ---------------------------------------------------------------------------
rerun-incomplete: True

# ---------------------------------------------------------------------------
# Reporting / verbosity
# ---------------------------------------------------------------------------
printshellcmds: False
show-failed-logs: False


# ---------------------------------------------------------------------------
# Rulespecific resources on claix
# ---------------------------------------------------------------------------
set-resources:
  # oom
  build_eurostat_balances:
    localrule: true
  build_biomass_potentials:
    localrule: true
  build_biomass_transport_costs:
    localrule: true
  build_district_heat_share:
    localrule: true
  build_industry_sector_ratios:
    localrule: true
  build_ammonia_production:
    localrule: true
  build_industrial_production_per_country:
    localrule: true
  build_industrial_production_per_country_tomorrow:
    localrule: true
  build_industrial_energy_demand_per_country_today:
    localrule: true
  build_industry_sector_ratios_intermediate:
    localrule: true
  build_industrial_distribution_key:
    localrule: true

  build_river_heat_potential:
    localrule: true
  # just low CPU efficiency
  add_electricity:
    localrule: true
  prepare_network:
    localrule: true
  time_aggregation:
    localrule: true

  build_population_weighted_energy_totals:
    localrule: true
  build_district_heat_share:
    localrule: true
  build_renewable_profiles:
    localrule: true
  build_hourly_heat_demand:
    localrule: true
  build_central_heating_temperature_profiles:
    localrule: true
  build_river_heat_potential:
    localrule: true
  build_clustered_solar_rooftop_potentials:
    localrule: true
  build_ates_potentials:
    localrule: true
  build_direct_heat_source_utilisation_profiles:
    localrule: true
  build_ptes_operations_wildcards:
    localrule: true
  build_direct_heat_source_utilisation_profiles:
    localrule: true
  build_ates_potentials:
    localrule: true

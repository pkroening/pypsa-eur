run:
  name: "test-sector-myopic-mga"
  default_target_rule: "all_mga"

foresight: myopic

countries:
- DE
- FR

snapshots:
  start: "2013-03-01"
  end: "2013-03-08"

clustering:
  temporal:
    resolution_elec: false
    resolution_sector: 28seg  # 7*4

scenario:
  clusters:
  - 5
  planning_horizons:
  - 2025
  - 2030
  - 2035
  mga:
    slack:
    - 0.05
    - 0.10
    slack_initial_fraction: 0.5

    # Regional settings
    region:
    - DE

    # Reroute EU-wide commodity pools over one bus per country
    regionalise_eu_buses:
    - oil
    - coal
    - lignite
    - methanol
    - NH3
    - uranium

    # Objective functions
    alternative_objectives:

      # Self-sufficiency
      min-imports:
        weights:
          varying:
            Link:
              p:
                # ignored
            Line:
              s:
                # ignored

      min-imports_elec:
        weights:
          varying:
            Link:
              p:
                DC: 1
            Line:
              s:
                AC: 1

      # Fossil imports as primary energy. One interface link per commodity, each
      # carrying that commodity in both directions, so domestic production nets
      # against the draw. Gas is already nodal and crosses on its pipeline.
      min-imports_fossil:
        weights:
          varying:
            Link:
              p:
              #  "uranium interface": 1
                "oil interface": 1
                "coal interface": 1
                "lignite interface": 1
                "gas pipeline": 1

      # Same carriers as electricity equivalents. Weights are the efficiency of
      # each fuel's link into an AC bus (coal 0.356, lignite 0.330, oil 0.350,
      # gas 0.570 via CCGT), taken as a fixed reference: they drift by 1-3 % over
      # the horizons and coal has no link into AC left in 2035.
      min-imports_fossil_el:
        weights:
          varying:
            Link:
              p:
                "oil interface": 0.350
                "coal interface": 0.356
                "lignite interface": 0.330
                "gas pipeline": 0.570

      # Synthetic fuel imports as primary energy. H2 is already nodal and crosses
      # on its pipeline. Ammonia and methanol produced domestically leave over the
      # same interface link, so Haber-Bosch and methanolisation net correctly.
      min-imports_synfuel:
        weights:
          varying:
            Link:
              p:
                "H2 pipeline": 1
                "NH3 interface": 1
                "methanol interface": 1

      # Same carriers as electricity equivalents. H2 0.500 via fuel cell,
      # methanol 0.405 via OCGT methanol; ammonia has no direct link into an AC
      # bus, so it goes through the cracker first: 0.6849 * 0.500.
      min-imports_synfuel_el:
        weights:
          varying:
            Link:
              p:
                "H2 pipeline": 0.500
                "NH3 interface": 0.342
                "methanol interface": 0.405


      # Costs
      # objective function is split
      min-capex:
      max-capex:
      min-opex:
      max-opex:

      # Technology focus
      min-tech_H2_El:
        weights:
          varying:
            Link:
              p:
                "H2 Electrolysis": 1
      max-tech_H2_El:
        weights:
          varying:
            Link:
              p:
                "H2 Electrolysis": 1

run:
  name: "test-sector-myopic-mga"
  default_target_rule: "all_mga"

foresight: myopic

countries:
- DE
- FR

snapshots:
  start: "2013-03-01"
  end: "2013-03-08"

clustering:
  temporal:
    resolution_elec: false
    resolution_sector: 28seg  # 7*4

scenario:
  clusters:
  - 5
  planning_horizons:
  - 2025
  - 2030
  - 2035
  mga:
    slack:
    - 0.05
    - 0.10
    slack_initial_fraction: 0.5
    alternative_objectives:
      # Technology focus
      min-tech_H2_El:
        weights:
          varying:
            Link:
              p:
                "H2 Electrolysis": 1
      max-tech_H2_El:
        weights:
          varying:
            Link:
              p:
                "H2 Electrolysis": 1

      # Autarky
      min-imports_elec:
        weights:
          varying:
            Link:
              p:
                # ignored
            Line:
              # In PyPSA optimization problems, AC is linearised in a way,
              # that s represents the active power, not the apparent power.
              s:
                # ignored
    region:
    - DE

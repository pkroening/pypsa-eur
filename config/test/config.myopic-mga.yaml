run:
  name: "test-sector-myopic-mga"
  default_target_rule: "plot_all_summaries"

foresight: myopic

countries: 
  - DE
  - FR

snapshots:
  start: "2013-03-01"
  end: "2013-03-08"

scenario:
  clusters:
  - 5
  planning_horizons:
  - 2025
  - 2030
  - 2035
  mga:
    slack:
    - 0.1
    slack_initial_fraction: 0.5
    alternative_objectives:
      # Technology focus
      min-tech_H2_El:
        weights:
          varying:
            Link:
              p:
                "H2 Electrolysis": 1
      max-tech_H2_El:
        weights:
          varying:
            Link:
              p:
                "H2 Electrolysis": 1

      # Autarky
      min-imports_elec:
        weights:
          varying:
            Link:
              p:
                "DC": 1
                # TODO: Check units
                "H2 pipeline": 1
                "gas pipeline": 1
            Line:
              # In PyPSA optimization problems, AC is linearised in a way,
              # that s represents the active power, not the apparent power.
              s:
                "AC": 1
    region:
    - DE

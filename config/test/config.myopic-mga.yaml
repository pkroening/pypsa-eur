run:
  name: "test-sector-myopic-mga"
  default_target_rule: "plot_pathways"

countries:
- DE
- FR

snapshots:
  start: "2013-03-01"
  end: "2013-03-08"

clustering:
  temporal:
    resolution_elec: false
    resolution_sector: 28seg  # 7*4

scenario:
  clusters:
  - 5
  planning_horizons:
  - 2025
  - 2030
  - 2035
  mga:
    slack:
    - 0.05
    - 0.10

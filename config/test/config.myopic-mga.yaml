run:
  name: "test-sector-myopic-mga"
  default_target_rule: "all_mga"

foresight: myopic

countries:
- DE
- FR

snapshots:
  start: "2013-03-01"
  end: "2013-03-08"

clustering:
  temporal:
    resolution_elec: false
    resolution_sector: 28seg  # 7*4

scenario:
  clusters:
  - 5
  planning_horizons:
  - 2025
  - 2030
  - 2035
  mga:
    slack:
    - 0.05
    - 0.10
    slack_initial_fraction: 0.5

    alternative_objectives:

      # Self-sufficiency
      min-imports:
        weights:
          varying:
            Link:
              p:
                # ignored
            Line:
              s:
                # ignored

      min-imports_elec:
        weights:
          varying:
            Link:
              p:
                DC: 1
            Line:
              s:
                AC: 1

      min-imports_fossil:
        weights:
          varying:
            Link:
              p:
              #  nuclear: 1
                oil: 1
                OCGT: 1
                CCGT: 1
                coal: 1
                lignite: 1


      # Costs
      # objective function is split
      min-capex:
      max-capex:
      min-opex:
      max-opex:

      # Technology focus
      min-tech_H2_El:
        weights:
          varying:
            Link:
              p:
                "H2 Electrolysis": 1
      max-tech_H2_El:
        weights:
          varying:
            Link:
              p:
                "H2 Electrolysis": 1

    region:
    - DE

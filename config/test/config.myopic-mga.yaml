run:
  name: "test-sector-myopic-mga"
  disable_progressbar: true
  shared_resources:
    policy: false

foresight: myopic

scenario:
  clusters:
  - 5
  planning_horizons:
  - 2025
  - 2030
  - 2035
  slack:
  - 0.1

countries: 
  - DE
  - FR

snapshots:
  start: "2013-03-01"
  end: "2013-03-08"

mga:
  region:
  - DE
  weights:
    varying:
      Link:
        p:
          "H2 Electrolysis": 1
  slack_initial_fraction: 0.5

plotting:
  map:
    boundaries:
  eu_node_location:
    x: -5.5
    y: 46.
  costs_max: 1000
  costs_threshold: 0.0000001
  energy_max:
  energy_min:
  energy_threshold: 0.000001
  interactive_bus_balance:
    bus_name_pattern: "*central heat*"
  enable_heat_source_maps: true

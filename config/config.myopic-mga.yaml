run:
  name: "myopic-mga"
  default_target_rule: "all_mga"

foresight: myopic

scenario:
  planning_horizons:
  - 2025
  - 2030
  - 2035
  - 2040
  - 2045
  - 2050
  mga:
    slack:
    - 0.02
    - 0.05
    - 0.1
    slack_initial_fraction: 0.5
    alternative_objectives:
      # Technology focus
      min-tech_H2_El:
        weights:
          varying:
            Link:
              p:
                "H2 Electrolysis": 1
      max-tech_H2_El:
        weights:
          varying:
            Link:
              p:
                "H2 Electrolysis": 1

      # Autarky
      min-import_energy:
        weights:
          varying:
            Link:
              p:
                # ignored
            Line:
              # In PyPSA optimization problems, AC is linearised in a way,
              # that s represents the active power, not the apparent power.
              s:
                # ignored
    region:
    - DE
